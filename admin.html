<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GX-Touch Cloud | Administración Local</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background: #f8fafc; }</style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- ENCABEZADO -->
        <div class="bg-gradient-to-r from-slate-900 to-indigo-950 text-white p-6 rounded-2xl shadow-xl flex flex-col md:flex-row items-center justify-between gap-4 border border-indigo-900/50">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-2xl md:text-3xl font-bold tracking-tight">GX-Touch Cloud</h1>
                    <span class="bg-indigo-500/30 text-indigo-200 text-xs px-2.5 py-1 rounded-full font-mono border border-indigo-400/30">Panel Seguro</span>
                </div>
                <p id="lblEmpresa" class="text-slate-300 text-sm mt-1">Cargando sistema...</p>
            </div>
            <button onclick="logout()" class="hidden id-auth bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl font-semibold text-xs uppercase tracking-wider transition shadow-md flex items-center gap-2">
                <span>Cerrar Sesión</span>
            </button>
        </div>

        <!-- PASO 1: LOGIN CON CLAVE ADMIN -->
        <div id="panelLogin" class="bg-white p-8 rounded-2xl shadow-lg border border-slate-200/80 mt-8 text-center max-w-md mx-auto">
            <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner border border-indigo-100">
                🔒
            </div>
            <h2 class="text-xl font-bold text-slate-800 mb-1">Acceso Administrativo</h2>
            <p class="text-slate-500 text-sm mb-6">Introduce tu clave de seguridad para continuar.</p>
            <input type="password" id="txtClaveIngresada" placeholder="••••••••" class="w-full px-4 py-3 border border-slate-300 rounded-xl mb-4 text-center text-xl tracking-widest focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20 shadow-sm" onkeydown="if(event.key === 'Enter') verificarClave()">
            <button onclick="verificarClave()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-md shadow-indigo-600/20">Ingresar al Sistema</button>
        </div>

        <!-- PASO 2: PANEL DE PRODUCTOS -->
        <div id="panelAdmin" class="hidden mt-6 space-y-6">
            
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap justify-between items-center gap-4">
                <button onclick="abrirModalFormulario()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-md shadow-indigo-600/20 transition flex items-center gap-2">
                    <span>+ Nuevo Producto</span>
                </button>
                <button onclick="abrirModalClave()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl font-semibold text-sm transition border border-slate-200">🔒 Cambiar Clave Admin</button>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <h3 class="font-bold text-slate-700">Inventario Sincronizado</h3>
                    <span id="contadorProductos" class="text-xs bg-indigo-50 text-indigo-700 font-bold px-3 py-1 rounded-full border border-indigo-100">0 productos</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse whitespace-nowrap">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                                <th class="p-3.5">Código</th>
                                <th class="p-3.5">Producto</th>
                                <th class="p-3.5 text-right">Costo ($)</th>
                                <th class="p-3.5 text-right">Venta ($)</th>
                                <th class="p-3.5 text-center">Stock</th>
                                <th class="p-3.5 text-center">Ganancia (%)</th>
                                <th class="p-3.5 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProductosBody" class="text-sm text-slate-700 divide-y divide-slate-100">
                            <!-- Inyectado por JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- BOTÓN DE GUARDAR LOCAL -->
            <div class="text-center pb-12 pt-4">
                <button onclick="guardarJsonLocal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-4 rounded-xl shadow-lg shadow-emerald-600/20 text-base transition transform hover:scale-102 flex items-center gap-3 mx-auto">
                    <span>💾 Guardar y Sincronizar Cambios</span>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL / FORMULARIO -->
    <div id="modalProducto" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 space-y-4 border border-slate-100">
            <h3 id="modalTitulo" class="text-xl font-bold text-slate-800 border-b pb-2">Nuevo Producto</h3>
            <input type="hidden" id="editIndex" value="-1">

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Código</label>
                    <input type="text" id="fCodigo" class="w-full px-3 py-2 border rounded-xl focus:border-indigo-600 focus:outline-none font-mono text-sm shadow-sm" placeholder="Ej. P002">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Stock</label>
                    <input type="number" id="fStock" class="w-full px-3 py-2 border rounded-xl focus:border-indigo-600 focus:outline-none text-sm shadow-sm" value="10">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre del Producto</label>
                <input type="text" id="fNombre" class="w-full px-3 py-2 border rounded-xl focus:border-indigo-600 focus:outline-none text-sm shadow-sm" placeholder="Ej. Cable USB">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Departamento</label>
                    <input type="text" id="fDepto" class="w-full px-3 py-2 border rounded-xl focus:border-indigo-600 focus:outline-none text-sm shadow-sm" value="GENERAL">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Estado</label>
                    <input type="text" id="fEstado" class="w-full px-3 py-2 border rounded-xl focus:border-indigo-600 focus:outline-none text-sm shadow-sm" value="ACTIVO">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Costo ($)</label>
                    <input type="number" step="0.01" id="fCosto" oninput="calcularPrecioAuto()" class="w-full px-3 py-2 border rounded-xl focus:border-indigo-600 focus:outline-none text-sm shadow-sm" value="1.00">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Factor</label>
                    <input type="number" step="0.01" id="fGanancia" oninput="calcularPrecioAuto()" class="w-full px-3 py-2 border rounded-xl focus:border-indigo-600 focus:outline-none text-sm font-bold text-amber-700 bg-amber-50 shadow-sm" value="0.70">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Venta ($)</label>
                    <input type="number" step="0.01" id="fVenta" class="w-full px-3 py-2 border rounded-xl focus:border-indigo-600 focus:outline-none text-sm font-bold text-indigo-700 bg-indigo-50 shadow-sm" value="1.43">
                </div>
            </div>

            <!-- ETIQUETA DINÁMICA DE PORCENTAJE EN MODAL -->
            <div class="bg-indigo-50/70 border border-indigo-100 p-2.5 rounded-xl text-center">
                <span class="text-xs text-slate-500">Equivalente real: </span>
                <span id="lblPorcentajeReal" class="text-xs font-bold text-indigo-700">30% de margen</span>
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t">
                <button onclick="cerrarModalFormulario()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition">Cancelar</button>
                <button onclick="guardarProductoModal()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm shadow-md transition">Guardar Producto</button>
            </div>
        </div>
    </div>

    <script>
        let datosJsonGlobal = null;
        let nombreArchivoLocal = "J312345670.json";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            let rifParam = urlParams.get('rif');
            
            if(rifParam) {
                nombreArchivoLocal = rifParam.replace(/[-\s]/g, "").toUpperCase() + ".json";
            }
            
            cargarJsonLocal();
        }

        async function cargarJsonLocal() {
            try {
                const response = await fetch(nombreArchivoLocal);
                if (!response.ok) throw new Error("No se pudo leer el archivo local.");
                
                datosJsonGlobal = await response.json();
                let rifMostrar = datosJsonGlobal.rifEmpresa || "J-31234567-0";
                document.getElementById('lblEmpresa').innerText = `RIF: ${rifMostrar} (Actualizar Productos en la Web)`;

            } catch (error) {
                console.warn(error);
                datosJsonGlobal = {
                    "rifEmpresa": "J-31234567-0",
                    "claveAdmin": "12345",
                    "ultimaActualizacion": "2026-08-09 14:12:13",
                    "tasaBcv": 36.50,
                    "porcentajeIva": 16.00,
                    "productos": [
                        {
                            "codigo": "P001",
                            "producto": "PRODUCTO DE PRUEBA",
                            "unidad": "PIEZA",
                            "categoria": "GENERAL",
                            "pasillo": "0",
                            "estante": "0",
                            "cantidad": 100,
                            "cantreserva": 5,
                            "reservamax": 100,
                            "preciocompra": 36.50,
                            "precioventa": 52.145,
                            "siiva": 1,
                            "cheiva1": 1,
                            "cheiva2": 0,
                            "porcen": 0.70,
                            "dola": 1.43,
                            "poriva": 16,
                            "montoiva": 0,
                            "precioiva": 1.43,
                            "precosdol": 1.00,
                            "preciodol": 1.43,
                            "identi": "PRODUCTOS",
                            "usu": "ADMINISTRADOR",
                            "item3": 1,
                            "item": "P1",
                            "item8": 36.50,
                            "item11": 36.50,
                            "item19": 36.50,
                            "item13": 1.00,
                            "item16": 1.00,
                            "item20": 1.00,
                            "item18": "DIVISA",
                            "item21": "NO",
                            "item23": "ALMACEN",
                            "item24": 1.43,
                            "item26": 0.70,
                            "item27": "GENERAL",
                            "item31": "ACTIVO",
                            "item32": "",
                            "item34": 52.145,
                            "item36": "AGOSTO 2026",
                            "item39": 1.43,
                            "item40": 1.43,
                            "item44": 0,
                            "item48": 36.50,
                            "estadoSincronizacion": "EDITADO"
                        }
                    ]
                };
                let rifMostrar = datosJsonGlobal.rifEmpresa || "J-31234567-0";
                document.getElementById('lblEmpresa').innerText = `RIF: ${rifMostrar} (Actualizar Productos en la Web)`;
            }
        }

        function verificarClave() {
            const ingresada = document.getElementById('txtClaveIngresada').value;
            if(!datosJsonGlobal) {
                alert("Cargando el sistema, por favor espere un momento...");
                return;
            }
            
            if(ingresada === (datosJsonGlobal.claveAdmin || "12345")) {
                document.getElementById('panelLogin').classList.add('hidden');
                document.getElementById('panelAdmin').classList.remove('hidden');
                document.querySelectorAll('.id-auth').forEach(el => el.classList.remove('hidden'));
                renderizarTabla();
            } else {
                alert("La clave de administración es incorrecta. Verifique e intente de nuevo.");
            }
        }

        function logout() {
            location.reload();
        }

        function obtenerPorcentajeLegible(factor) {
            let f = Number(factor);
            if (f > 0 && f < 1) {
                let porc = Math.round((1 - f) * 100);
                return `${porc}% (Margen)`;
            } else if (f >= 1) {
                let porc = Math.round((f - 1) * 100);
                return `${porc}% (Markup)`;
            }
            return "0%";
        }

        function renderizarTabla() {
            const tbody = document.getElementById('tablaProductosBody');
            tbody.innerHTML = "";
            document.getElementById('contadorProductos').innerText = `${datosJsonGlobal.productos.length} productos`;

            datosJsonGlobal.productos.forEach((p, index) => {
                let costo = Number(p.precosdol || p.item13 || 0);
                let venta = Number(p.dola || p.preciodol || 0);
                let stock = p.cantidad !== undefined ? p.cantidad : 0;
                let factor = p.porcen || p.item26 || 0.70;

                let textoPorcentaje = obtenerPorcentajeLegible(factor);

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="p-3.5 font-mono text-xs text-slate-500">${p.codigo}</td>
                        <td class="p-3.5 font-medium text-slate-800">${p.producto}</td>
                        <td class="p-3.5 text-right font-mono text-slate-600">$${costo.toFixed(2)}</td>
                        <td class="p-3.5 text-right font-mono font-bold text-indigo-900">$${venta.toFixed(2)}</td>
                        <td class="p-3.5 text-center font-semibold text-slate-700">${stock}</td>
                        <td class="p-3.5 text-center font-mono font-bold text-emerald-600">${textoPorcentaje}</td>
                        <td class="p-3.5 text-center space-x-1">
                            <button onclick="abrirModalEditar(${index})" class="bg-slate-100 hover:bg-indigo-50 text-indigo-600 px-3 py-1 rounded-lg text-xs font-bold transition">Editar</button>
                            <button onclick="eliminarProducto(${index})" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-1 rounded-lg text-xs font-bold transition">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        function calcularPrecioAuto() {
            let costo = parseFloat(document.getElementById('fCosto').value) || 0;
            let factor = parseFloat(document.getElementById('fGanancia').value) || 0.70;
            let venta = 0;

            if (factor > 0 && factor < 1) {
                venta = costo / factor;
                let porcentajeMargen = Math.round((1 - factor) * 100);
                document.getElementById('lblPorcentajeReal').innerText = `${porcentajeMargen}% de margen (Divisor)`;
            } else if (factor >= 1) {
                venta = costo * factor;
                let porcentajeIncremento = Math.round((factor - 1) * 100);
                document.getElementById('lblPorcentajeReal').innerText = `${porcentajeIncremento}% de incremento (Multiplicador)`;
            } else {
                venta = costo;
                document.getElementById('lblPorcentajeReal').innerText = `0%`;
            }
            
            document.getElementById('fVenta').value = venta.toFixed(2);
        }

        function abrirModalFormulario() {
            document.getElementById('modalTitulo').innerText = "Nuevo Producto";
            document.getElementById('editIndex').value = "-1";
            document.getElementById('fCodigo').value = "";
            document.getElementById('fNombre').value = "";
            document.getElementById('fDepto').value = "GENERAL";
            document.getElementById('fEstado').value = "ACTIVO";
            document.getElementById('fCosto').value = "1.00";
            document.getElementById('fGanancia').value = "0.70";
            document.getElementById('fVenta').value = "1.43";
            document.getElementById('fStock').value = "10";
            calcularPrecioAuto();
            document.getElementById('modalProducto').classList.remove('hidden');
        }

        function abrirModalEditar(index) {
            let p = datosJsonGlobal.productos[index];
            document.getElementById('modalTitulo').innerText = "Editar Producto";
            document.getElementById('editIndex').value = index;
            document.getElementById('fCodigo').value = p.codigo || "";
            document.getElementById('fNombre').value = p.producto || "";
            document.getElementById('fDepto').value = p.categoria || p.item27 || "GENERAL";
            document.getElementById('fEstado').value = p.item31 || "ACTIVO";
            document.getElementById('fCosto').value = Number(p.precosdol || p.item13 || 1).toFixed(2);
            document.getElementById('fGanancia').value = p.porcen || p.item26 || 0.70;
            document.getElementById('fVenta').value = Number(p.dola || p.preciodol || 1.43).toFixed(2);
            document.getElementById('fStock').value = p.cantidad !== undefined ? p.cantidad : 10;
            calcularPrecioAuto();
            document.getElementById('modalProducto').classList.remove('hidden');
        }

        function cerrarModalFormulario() {
            document.getElementById('modalProducto').classList.add('hidden');
        }

        function guardarProductoModal() {
            let index = parseInt(document.getElementById('editIndex').value);
            let codigo = document.getElementById('fCodigo').value.trim();
            let nombre = document.getElementById('fNombre').value.trim();
            let depto = document.getElementById('fDepto').value.trim().toUpperCase();
            let estado = document.getElementById('fEstado').value.trim().toUpperCase();
            let costo = parseFloat(document.getElementById('fCosto').value) || 0;
            let factor = parseFloat(document.getElementById('fGanancia').value) || 0.70;
            let precio = parseFloat(document.getElementById('fVenta').value) || 0;
            let stock = parseInt(document.getElementById('fStock').value) || 0;

            if(!codigo || !nombre) {
                alert("Por favor complete los campos obligatorios: Código y Nombre del producto.");
                return;
            }

            const meses = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];
            const fechaActual = new Date();
            const mesAnioDinamico = meses[fechaActual.getMonth()] + " " + fechaActual.getFullYear();
            let tasaBcv = Number(datosJsonGlobal.tasaBcv || 36.50);

            if (index === -1) {
                let nuevo = {
                    "codigo": codigo,
                    "producto": nombre,
                    "unidad": "PIEZA",
                    "categoria": depto,
                    "pasillo": "0",
                    "estante": "0",
                    "cantidad": stock,
                    "cantreserva": 5,
                    "reservamax": 100,
                    "preciocompra": costo * tasaBcv,
                    "precioventa": precio * tasaBcv,
                    "siiva": 1,
                    "cheiva1": 1,
                    "cheiva2": 0,
                    "porcen": factor,
                    "dola": precio,
                    "poriva": Number(datosJsonGlobal.porcentajeIva || 16),
                    "montoiva": 0,
                    "precioiva": precio,
                    "precosdol": costo,
                    "preciodol": precio,
                    "identi": "PRODUCTOS",
                    "usu": "ADMINISTRADOR",
                    "item3": 1,
                    "item": "P1",
                    "item8": costo * tasaBcv,
                    "item11": costo * tasaBcv,
                    "item19": costo * tasaBcv,
                    "item13": costo,
                    "item16": costo,
                    "item20": costo,
                    "item18": "DIVISA",
                    "item21": "NO",
                    "item23": "ALMACEN",
                    "item24": precio,
                    "item26": factor,
                    "item27": depto,
                    "item31": estado,
                    "item32": "",
                    "item34": precio * tasaBcv,
                    "item36": mesAnioDinamico,
                    "item39": precio,
                    "item40": precio,
                    "item44": 0,
                    "item48": tasaBcv,
                    "estadoSincronizacion": "NUEVO"
                };
                datosJsonGlobal.productos.push(nuevo);
            } else {
                let p = datosJsonGlobal.productos[index];
                p.codigo = codigo;
                p.producto = nombre;
                p.categoria = depto;
                p.cantidad = stock;
                p.precosdol = costo;
                p.dola = precio;
                p.preciodol = precio;
                p.porcen = factor;
                p.item13 = costo;
                p.item24 = precio;
                p.item26 = factor;
                p.item27 = depto;
                p.item31 = estado;
                p.preciocompra = costo * tasaBcv;
                p.precioventa = precio * tasaBcv;
                p.item34 = precio * tasaBcv;
                p.estadoSincronizacion = "EDITADO";
            }

            cerrarModalFormulario();
            renderizarTabla();
        }

        function eliminarProducto(index) {
            let p = datosJsonGlobal.productos[index];
            if(confirm(`¿Está seguro de eliminar el producto "${p.producto}" del inventario?`)) {
                datosJsonGlobal.productos.splice(index, 1);
                renderizarTabla();
            }
        }

        function abrirModalClave() {
            let nuevaClave = prompt("Ingrese la nueva clave de administración:");
            if(nuevaClave) {
                datosJsonGlobal.claveAdmin = nuevaClave;
                alert("¡Clave actualizada con éxito! Haga clic en 'Guardar y Sincronizar Cambios' para aplicar los cambios.");
            }
        }

        function guardarJsonLocal() {
            const ahora = new Date();
            datosJsonGlobal.ultimaActualizacion = ahora.getFullYear() + '-' + 
                String(ahora.getMonth() + 1).padStart(2, '0') + '-' + 
                String(ahora.getDate()).padStart(2, '0') + ' ' + 
                String(ahora.getHours()).padStart(2, '0') + ':' + 
                String(ahora.getMinutes()).padStart(2, '0') + ':' + 
                String(ahora.getSeconds()).padStart(2, '0');

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(datosJsonGlobal, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", nombreArchivoLocal);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();

            alert(`¡Sincronización completada con éxito!\nEl archivo "${nombreArchivoLocal}" ha sido actualizado correctamente.`);
        }
    </script>
</body>
</html>
