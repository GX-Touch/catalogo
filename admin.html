<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GX-Touch Admin | Local</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background: #f1f5f9; }</style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- ENCABEZADO -->
        <div class="bg-[#2e1065] text-white p-6 rounded-2xl shadow-xl flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold">GX-Touch Panel Local</h1>
                <p id="lblEmpresa" class="text-violet-200 text-sm mt-1">Cargando datos...</p>
            </div>
            <button onclick="logout()" class="hidden id-auth bg-rose-500 hover:bg-rose-600 px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wide">Cerrar Sesión</button>
        </div>

        <!-- PASO 1: LOGIN CON CLAVE ADMIN -->
        <div id="panelLogin" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mt-6 text-center max-w-md mx-auto">
            <h2 class="text-xl font-bold text-slate-700 mb-2">Acceso Administrativo</h2>
            <p class="text-slate-500 text-sm mb-4">Ingresa la clave de administración.</p>
            <input type="password" id="txtClaveIngresada" placeholder="Clave Admin" class="w-full px-4 py-3 border border-slate-300 rounded-xl mb-4 text-center text-lg focus:outline-none focus:border-violet-600" onkeydown="if(event.key === 'Enter') verificarClave()">
            <button onclick="verificarClave()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl transition">Entrar al Panel</button>
        </div>

        <!-- PASO 2: PANEL DE PRODUCTOS -->
        <div id="panelAdmin" class="hidden mt-6 space-y-6">
            
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap justify-between items-center gap-4">
                <button onclick="abrirModalFormulario()" class="bg-violet-600 hover:bg-violet-700 text-white px-5 py-2.5 rounded-lg font-bold text-sm shadow flex items-center gap-2">
                    <span>+ Nuevo Producto</span>
                </button>
                <button onclick="abrirModalClave()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2.5 rounded-lg font-semibold text-sm">Cambiar Clave Admin</button>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                    <h3 class="font-bold text-slate-700">Inventario Local</h3>
                    <span id="contadorProductos" class="text-xs bg-violet-100 text-violet-700 font-bold px-2.5 py-1 rounded-full">0 productos</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse whitespace-nowrap">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                                <th class="p-3">Código</th>
                                <th class="p-3">Producto</th>
                                <th class="p-3 text-right">Costo ($)</th>
                                <th class="p-3 text-right">Venta ($)</th>
                                <th class="p-3 text-center">Stock</th>
                                <th class="p-3 text-center">Ganancia (%)</th>
                                <th class="p-3 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProductosBody" class="text-sm text-slate-700 divide-y divide-slate-100">
                            <!-- Inyectado por JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- BOTÓN DE GUARDAR LOCAL (DESCARGA JSON) -->
            <div class="text-center pb-12">
                <button onclick="guardarJsonLocal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-4 rounded-xl shadow-lg text-base transition transform hover:scale-105">
                    💾 Guardar Cambios (Actualizar Archivo Local)
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL / FORMULARIO -->
    <div id="modalProducto" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 space-y-4 border border-slate-100">
            <h3 id="modalTitulo" class="text-xl font-bold text-slate-800 border-b pb-2">Nuevo Producto</h3>
            <input type="hidden" id="editIndex" value="-1">

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Código</label>
                    <input type="text" id="fCodigo" class="w-full px-3 py-2 border rounded-xl focus:border-violet-600 focus:outline-none font-mono text-sm" placeholder="Ej. P002">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Stock</label>
                    <input type="number" id="fStock" class="w-full px-3 py-2 border rounded-xl focus:border-violet-600 focus:outline-none text-sm" value="10">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre del Producto</label>
                <input type="text" id="fNombre" class="w-full px-3 py-2 border rounded-xl focus:border-violet-600 focus:outline-none text-sm" placeholder="Ej. Cable USB">
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Costo ($)</label>
                    <input type="number" step="0.01" id="fCosto" oninput="calcularPrecioAuto()" class="w-full px-3 py-2 border rounded-xl focus:border-violet-600 focus:outline-none text-sm" value="1.00">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Factor</label>
                    <input type="number" step="0.01" id="fGanancia" oninput="calcularPrecioAuto()" class="w-full px-3 py-2 border rounded-xl focus:border-violet-600 focus:outline-none text-sm font-bold text-amber-700 bg-amber-50" value="0.70">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Venta ($)</label>
                    <input type="number" step="0.01" id="fVenta" class="w-full px-3 py-2 border rounded-xl focus:border-violet-600 focus:outline-none text-sm font-bold text-violet-700 bg-violet-50" value="1.43">
                </div>
            </div>

            <!-- ETIQUETA DINÁMICA DE PORCENTAJE EN MODAL -->
            <div class="bg-violet-50 border border-violet-100 p-2.5 rounded-xl text-center">
                <span class="text-xs text-slate-500">Equivalente real: </span>
                <span id="lblPorcentajeReal" class="text-xs font-bold text-violet-700">30% de margen</span>
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t">
                <button onclick="cerrarModalFormulario()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm">Cancelar</button>
                <button onclick="guardarProductoModal()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow">Guardar Producto</button>
            </div>
        </div>
    </div>

    <script>
        let datosJsonGlobal = null;
        let nombreArchivoLocal = "J312345670.json";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            let rifParam = urlParams.get('rif');
            
            if(rifParam) {
                nombreArchivoLocal = rifParam.replace(/[-\s]/g, "").toUpperCase() + ".json";
            }
            
            cargarJsonLocal();
        }

        async function cargarJsonLocal() {
            try {
                const response = await fetch(nombreArchivoLocal);
                if (!response.ok) throw new Error("No se pudo leer el archivo local.");
                
                datosJsonGlobal = await response.json();
                document.getElementById('lblEmpresa').innerText = `RIF: ${datosJsonGlobal.rifEmpresa} | Archivo: ${nombreArchivoLocal}`;

            } catch (error) {
                console.warn(error);
                datosJsonGlobal = {
                    "rifEmpresa": "J-31234567-0",
                    "claveAdmin": "12345",
                    "ultimaActualizacion": "2026-08-09 14:12:13",
                    "tasaBcv": 36.50,
                    "porcentajeIva": 16.00,
                    "productos": [
                        {
                            "codigo": "P001",
                            "producto": "PRODUCTO DE PRUEBA",
                            "dola": 1.43,
                            "precosdol": 1.00,
                            "porcen": 0.70,
                            "cantidad": 100
                        }
                    ]
                };
                document.getElementById('lblEmpresa').innerText = `RIF: ${datosJsonGlobal.rifEmpresa} (Modo Emergencia)`;
            }
        }

        function verificarClave() {
            const ingresada = document.getElementById('txtClaveIngresada').value;
            if(!datosJsonGlobal) {
                alert("Cargando datos, espera un momento...");
                return;
            }
            
            if(ingresada === (datosJsonGlobal.claveAdmin || "12345")) {
                document.getElementById('panelLogin').classList.add('hidden');
                document.getElementById('panelAdmin').classList.remove('hidden');
                document.querySelectorAll('.id-auth').forEach(el => el.classList.remove('hidden'));
                renderizarTabla();
            } else {
                alert("Clave de administración incorrecta.");
            }
        }

        function logout() {
            location.reload();
        }

        // FUNCIÓN PARA CONVERTIR EL FACTOR EN PORCENTAJE LEGIBLE
        function obtenerPorcentajeLegible(factor) {
            let f = Number(factor);
            if (f > 0 && f < 1) {
                let porc = Math.round((1 - f) * 100);
                return `${porc}% (Margen)`;
            } else if (f >= 1) {
                let porc = Math.round((f - 1) * 100);
                return `${porc}% (Markup)`;
            }
            return "0%";
        }

        function renderizarTabla() {
            const tbody = document.getElementById('tablaProductosBody');
            tbody.innerHTML = "";
            document.getElementById('contadorProductos').innerText = `${datosJsonGlobal.productos.length} productos`;

            datosJsonGlobal.productos.forEach((p, index) => {
                let costo = Number(p.precosdol || p.item13 || 0);
                let venta = Number(p.dola || p.preciodol || 0);
                let stock = p.cantidad !== undefined ? p.cantidad : 0;
                let factor = p.porcen || p.item26 || 0.70;

                let textoPorcentaje = obtenerPorcentajeLegible(factor);

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-mono text-xs text-slate-500">${p.codigo}</td>
                        <td class="p-3 font-medium">${p.producto}</td>
                        <td class="p-3 text-right font-mono">$${costo.toFixed(2)}</td>
                        <td class="p-3 text-right font-mono font-bold text-violet-900">$${venta.toFixed(2)}</td>
                        <td class="p-3 text-center font-semibold">${stock}</td>
                        <td class="p-3 text-center font-mono font-bold text-emerald-700">${textoPorcentaje}</td>
                        <td class="p-3 text-center space-x-1">
                            <button onclick="abrirModalEditar(${index})" class="bg-slate-100 hover:bg-violet-100 text-violet-700 px-2.5 py-1 rounded-lg text-xs font-bold">Editar</button>
                            <button onclick="eliminarProducto(${index})" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-2.5 py-1 rounded-lg text-xs font-bold">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        function calcularPrecioAuto() {
            let costo = parseFloat(document.getElementById('fCosto').value) || 0;
            let factor = parseFloat(document.getElementById('fGanancia').value) || 0.70;
            let venta = 0;

            if (factor > 0 && factor < 1) {
                venta = costo / factor;
                let porcentajeMargen = Math.round((1 - factor) * 100);
                document.getElementById('lblPorcentajeReal').innerText = `${porcentajeMargen}% de margen (Divisor)`;
            } else if (factor >= 1) {
                venta = costo * factor;
                let porcentajeIncremento = Math.round((factor - 1) * 100);
                document.getElementById('lblPorcentajeReal').innerText = `${porcentajeIncremento}% de incremento (Multiplicador)`;
            } else {
                venta = costo;
                document.getElementById('lblPorcentajeReal').innerText = `0%`;
            }
            
            document.getElementById('fVenta').value = venta.toFixed(2);
        }

        function abrirModalFormulario() {
            document.getElementById('modalTitulo').innerText = "Nuevo Producto";
            document.getElementById('editIndex').value = "-1";
            document.getElementById('fCodigo').value = "";
            document.getElementById('fNombre').value = "";
            document.getElementById('fCosto').value = "1.00";
            document.getElementById('fGanancia').value = "0.70";
            document.getElementById('fVenta').value = "1.43";
            document.getElementById('fStock').value = "10";
            calcularPrecioAuto();
            document.getElementById('modalProducto').classList.remove('hidden');
        }

        function abrirModalEditar(index) {
            let p = datosJsonGlobal.productos[index];
            document.getElementById('modalTitulo').innerText = "Editar Producto";
            document.getElementById('editIndex').value = index;
            document.getElementById('fCodigo').value = p.codigo || "";
            document.getElementById('fNombre').value = p.producto || "";
            document.getElementById('fCosto').value = Number(p.precosdol || p.item13 || 1).toFixed(2);
            document.getElementById('fGanancia').value = p.porcen || p.item26 || 0.70;
            document.getElementById('fVenta').value = Number(p.dola || p.preciodol || 1.43).toFixed(2);
            document.getElementById('fStock').value = p.cantidad !== undefined ? p.cantidad : 10;
            calcularPrecioAuto();
            document.getElementById('modalProducto').classList.remove('hidden');
        }

        function cerrarModalFormulario() {
            document.getElementById('modalProducto').classList.add('hidden');
        }

        function guardarProductoModal() {
            let index = parseInt(document.getElementById('editIndex').value);
            let codigo = document.getElementById('fCodigo').value.trim();
            let nombre = document.getElementById('fNombre').value.trim();
            let costo = parseFloat(document.getElementById('fCosto').value) || 0;
            let factor = parseFloat(document.getElementById('fGanancia').value) || 0.70;
            let venta = parseFloat(document.getElementById('fVenta').value) || 0;
            let stock = parseInt(document.getElementById('fStock').value) || 0;

            if(!codigo || !nombre) {
                alert("El código y el nombre son obligatorios.");
                return;
            }

            if (index === -1) {
                let nuevo = {
                    "codigo": codigo,
                    "producto": nombre,
                    "dola": venta,
                    "precosdol": costo,
                    "porcen": factor,
                    "cantidad": stock
                };
                datosJsonGlobal.productos.push(nuevo);
            } else {
                let p = datosJsonGlobal.productos[index];
                p.codigo = codigo;
                p.producto = nombre;
                p.precosdol = costo;
                p.dola = venta;
                p.porcen = factor;
                p.cantidad = stock;
            }

            cerrarModalFormulario();
            renderizarTabla();
        }

        function eliminarProducto(index) {
            let p = datosJsonGlobal.productos[index];
            if(confirm(`¿Estás seguro de eliminar "${p.producto}"?`)) {
                datosJsonGlobal.productos.splice(index, 1);
                renderizarTabla();
            }
        }

        function abrirModalClave() {
            let nuevaClave = prompt("Ingresa la nueva clave de administración:");
            if(nuevaClave) {
                datosJsonGlobal.claveAdmin = nuevaClave;
                alert("¡Clave actualizada en memoria! Haz clic en 'Guardar Cambios' para descargar el archivo actualizado.");
            }
        }

        function guardarJsonLocal() {
            const ahora = new Date();
            datosJsonGlobal.ultimaActualizacion = ahora.getFullYear() + '-' + 
                String(ahora.getMonth() + 1).padStart(2, '0') + '-' + 
                String(ahora.getDate()).padStart(2, '0') + ' ' + 
                String(ahora.getHours()).padStart(2, '0') + ':' + 
                String(ahora.getMinutes()).padStart(2, '0') + ':' + 
                String(ahora.getSeconds()).padStart(2, '0');

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(datosJsonGlobal, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", nombreArchivoLocal);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();

            alert(`¡Archivo ${nombreArchivoLocal} generado y descargado con éxito!\nColócalo en tu carpeta de trabajo en C:.`);
        }
    </script>
</body>
</html>
