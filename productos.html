<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GX-Cloud Admin | Panel de Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background: #f1f5f9; }</style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- ENCABEZADO -->
        <div class="bg-[#2e1065] text-white p-6 rounded-2xl shadow-xl flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold">GX-Touch Cloud Admin</h1>
                <p id="lblEmpresa" class="text-violet-200 text-sm mt-1">Cargando datos de la empresa...</p>
            </div>
            <button onclick="logout()" class="hidden id-auth bg-rose-500 hover:bg-rose-600 px-4 py-2 rounded-lg font-bold text-xs uppercase tracking-wide">Cerrar Sesión</button>
        </div>

        <!-- PASO 1: LOGIN CON CLAVE ADMIN -->
        <div id="panelLogin" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mt-6 text-center max-w-md mx-auto">
            <h2 class="text-xl font-bold text-slate-700 mb-2">Acceso Administrativo</h2>
            <p class="text-slate-500 text-sm mb-4">Ingresa la clave de administración de tu sistema.</p>
            <input type="password" id="txtClaveIngresada" placeholder="Clave Admin" class="w-full px-4 py-3 border border-slate-300 rounded-xl mb-4 text-center text-lg focus:outline-none focus:border-violet-600">
            <button onclick="verificarClave()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl transition">Entrar al Panel</button>
        </div>

        <!-- PASO 2: PANEL DE PRODUCTOS Y CONFIGURACIÓN (Oculto hasta autenticarse) -->
        <div id="panelAdmin" class="hidden mt-6 space-y-6">
            
            <!-- BARRA DE ACCESOS RÁPIDOS -->
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap justify-between items-center gap-4">
                <button onclick="abrirModalNuevo()" class="bg-violet-600 hover:bg-violet-700 text-white px-5 py-2.5 rounded-lg font-bold text-sm shadow">+ Nuevo Producto</button>
                <button onclick="abrirModalClave()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2.5 rounded-lg font-semibold text-sm">Cambiar Clave Admin</button>
            </div>

            <!-- TABLA DE PRODUCTOS -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                    <h3 class="font-bold text-slate-700">Inventario en la Nube</h3>
                    <span id="contadorProductos" class="text-xs bg-violet-100 text-violet-700 font-bold px-2.5 py-1 rounded-full">0 productos</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                                <th class="p-3">Código</th>
                                <th class="p-3">Producto</th>
                                <th class="p-3 text-right">Costo ($)</th>
                                <th class="p-3 text-right">Precio ($)</th>
                                <th class="p-3 text-center">Stock</th>
                                <th class="p-3 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProductosBody" class="text-sm text-slate-700 divide-y divide-slate-100">
                            <!-- Inyectado por JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- BOTÓN DE GUARDAR Y SINCRONIZAR -->
            <div class="text-center pb-12">
                <button onclick="guardarCambiosCloud()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-4 rounded-xl shadow-lg text-base transition transform hover:scale-105">
                    🚀 Guardar y Sincronizar Cambios
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE GESTIÓN OPTIMIZADO -->
    <script>
        const REPO_OWNER = "gx-touch";
        const REPO_NAME = "catalogo";
        
        let datosJsonGlobal = null;
        let rifActual = "";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            rifActual = urlParams.get('rif');
            if(!rifActual) {
                alert("No se encontró el RIF de la empresa en la URL.");
                return;
            }
            cargarJsonGitHub();
        }

        async function cargarJsonGitHub() {
            try {
                // Ruta relativa directa al archivo JSON dentro de la carpeta productos
                const url = `./productos/${rifActual}.json`;
                
                const response = await fetch(url);
                if(!response.ok) throw new Error("No se encontró el archivo de la empresa en la nube.");
                
                datosJsonGlobal = await response.json();

                document.getElementById('lblEmpresa').innerText = `RIF: ${datosJsonGlobal.rifEmpresa}`;
            } catch (error) {
                alert("Error cargando datos: " + error.message);
            }
        }

        function verificarClave() {
            const ingresada = document.getElementById('txtClaveIngresada').value;
            if(!datosJsonGlobal) {
                alert("Aún no se han cargado los datos de la nube. Espera un segundo.");
                return;
            }
            if(ingresada === datosJsonGlobal.claveAdmin) {
                document.getElementById('panelLogin').classList.add('hidden');
                document.getElementById('panelAdmin').classList.remove('hidden');
                document.querySelectorAll('.id-auth').forEach(el => el.classList.remove('hidden'));
                renderizarTabla();
            } else {
                alert("Clave de administración incorrecta.");
            }
        }

        function logout() {
            location.reload();
        }

        function renderizarTabla() {
            const tbody = document.getElementById('tablaProductosBody');
            tbody.innerHTML = "";
            document.getElementById('contadorProductos').innerText = `${datosJsonGlobal.productos.length} productos`;

            datosJsonGlobal.productos.forEach((p, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-mono text-xs text-slate-500">${p.codigo}</td>
                        <td class="p-3 font-medium">${p.producto}</td>
                        <td class="p-3 text-right font-mono">$${Number(p.precosdol).toFixed(2)}</td>
                        <td class="p-3 text-right font-mono font-bold text-violet-900">$${Number(p.dola).toFixed(2)}</td>
                        <td class="p-3 text-center font-semibold">${p.cantidad}</td>
                        <td class="p-3 text-center">
                            <button onclick="editarProducto(${index})" class="bg-slate-100 hover:bg-violet-100 text-violet-700 px-3 py-1.5 rounded-lg text-xs font-bold">Editar</button>
                        </td>
                    </tr>
                `;
            });
        }

        function editarProducto(index) {
            let p = datosJsonGlobal.productos[index];
            let nuevoPrecio = prompt(`Editar Precio ($) para: ${p.producto}`, p.dola);
            if(nuevoPrecio !== null && !isNaN(nuevoPrecio)) {
                p.dola = parseFloat(nuevoPrecio);
                p.precioventa = p.dola * (datosJsonGlobal.tasaBcv || 36);
                p.item24 = p.dola;
                p.item34 = p.precioventa;
                renderizarTabla();
            }
        }

        function abrirModalNuevo() {
            let codigo = prompt("Código del nuevo producto:");
            if(!codigo) return;
            let nombre = prompt("Nombre/Descripción del producto:");
            if(!nombre) return;
            let costo = parseFloat(prompt("Costo en dólares ($):", "1.00")) || 0;
            let precio = parseFloat(prompt("Precio de venta en dólares ($):", "1.50")) || 0;
            let stock = parseInt(prompt("Cantidad / Stock inicial:", "10")) || 0;

            const meses = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];
            const fechaActual = new Date();
            const mesAnioDinamico = meses[fechaActual.getMonth()] + " " + fechaActual.getFullYear();

            let nuevo = {
                "codigo": codigo,
                "producto": nombre,
                "unidad": "PIEZA",
                "categoria": "GENERAL",
                "pasillo": "0",
                "estante": "0",
                "cantidad": stock,
                "cantreserva": 5,
                "reservamax": 100,
                "preciocompra": costo * (datosJsonGlobal.tasaBcv || 36),
                "precioventa": precio * (datosJsonGlobal.tasaBcv || 36),
                "siiva": 1,
                "cheiva1": 1,
                "cheiva2": 0,
                "porcen": 30,
                "dola": precio,
                "poriva": datosJsonGlobal.porcentajeIva || 16,
                "montoiva": 0,
                "precioiva": precio,
                "precosdol": costo,
                "preciodol": precio,
                "identi": "PRODUCTOS",
                "usu": "ADMINISTRADOR",
                "item3": 1,
                "item": "P1",
                "item8": costo * (datosJsonGlobal.tasaBcv || 36),
                "item11": costo * (datosJsonGlobal.tasaBcv || 36),
                "item19": costo * (datosJsonGlobal.tasaBcv || 36),
                "item13": costo,
                "item16": costo,
                "item20": costo,
                "item18": "DIVISA",
                "item21": "NO",
                "item23": "ALMACEN",
                "item24": precio,
                "item26": 30,
                "item27": "NACIONAL",
                "item31": "ACTIVO",
                "item32": "",
                "item34": precio * (datosJsonGlobal.tasaBcv || 36),
                "item36": mesAnioDinamico,
                "item39": precio,
                "item40": precio,
                "item44": 0,
                "item48": datosJsonGlobal.tasaBcv || 36
            };

            datosJsonGlobal.productos.push(nuevo);
            renderizarTabla();
            alert("¡Producto agregado a la lista local! Haz clic en 'Guardar y Sincronizar Cambios' para actualizar la nube.");
        }

        function abrirModalClave() {
            let nuevaClave = prompt("Ingresa la nueva clave de administración:");
            if(nuevaClave) {
                datosJsonGlobal.claveAdmin = nuevaClave;
                alert("¡Clave actualizada! Haz clic en 'Guardar y Sincronizar Cambios' para aplicarla.");
            }
        }

        async function guardarCambiosCloud() {
            if(!confirm("¿Deseas guardar todos los cambios y actualizar la nube?")) return;

            const ahora = new Date();

                String(ahora.getDate()).padStart(2, '0') + ' ' + 
                String(ahora.getHours()).padStart(2, '0') + ':' + 
                String(ahora.getMinutes()).padStart(2, '0') + ':' + 
                String(ahora.getSeconds()).padStart(2, '0');
            
            datosJsonGlobal.ultimaActualizacion = fechaHoraStr;

            const jsonText = JSON.stringify(datosJsonGlobal, null, 2);
            
            alert("¡Estructura lista! Aquí conectamos con la API de GitHub mediante PUT usando el token para consolidar el guardado.");
        }
    </script>
</body>
</html>
